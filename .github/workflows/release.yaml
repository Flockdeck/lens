name: release

# Push a tag like v0.2.0. It runs all of ci.yaml, builds the program on every platform with the
# tag as its version, and drafts a GitHub release holding the archives and their checksums.
# Nothing is published: you read the draft and press the button.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yaml

  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag ${tag} is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate, version]
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ needs.version.outputs.value }}
      retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          ls -l
          sha256sum lens_* > checksums.txt
          cat checksums.txt
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" --draft --title "${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. Check each file against checksums.txt."
