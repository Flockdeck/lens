apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-lens-api
  namespace: session-lens
  labels:
    app: session-lens
    component: api
spec:
  # Exactly one replica, and Recreate: this Deployment's init container runs Alembic.
  # MySQL DDL is not transactional and Alembic takes no lock, so two concurrent
  # migrations (more replicas, or old and new pods overlapping in a rolling update)
  # could corrupt the schema. Raise replicas only after migrations take a GET_LOCK.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: session-lens
      component: api
  template:
    metadata:
      labels:
        app: session-lens
        component: api
    spec:
      serviceAccountName: session-lens
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Schema migrations run here, before the API starts (single replica only, see above).
        - name: migrate
          image: "ghcr.io/jmwri/session-lens:0.0.1" # {"$imagepolicy": "flux-system:session-lens"}
          imagePullPolicy: IfNotPresent
          command: ["session-lens", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: databaseUrl}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: "ghcr.io/jmwri/session-lens:0.0.1" # {"$imagepolicy": "flux-system:session-lens"}
          imagePullPolicy: IfNotPresent
          command: ["session-lens", "api"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: databaseUrl}
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3EndpointUrl}
            - name: S3_REGION
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3Region}
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3Bucket}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3AccessKey}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3SecretKey}
            - name: RAW_RETENTION_DAYS
              value: "30"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: apiToken}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: anthropicApiKey}
            - name: ENRICHER
              value: anthropic
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
