services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: session_lens
      MYSQL_USER: session_lens
      MYSQL_PASSWORD: session_lens
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object store for raw recordings (DigitalOcean Spaces in the cluster).
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "${S3_PORT:-9000}:8333"  # matches the S3_ENDPOINT_URL default
    volumes:
      - s3-data:/data
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the bucket and a 30-day expiry rule on the recordings/ prefix, the same
  # rule terrawost sets on the Spaces bucket. Safe to re-run.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://s3:8333 s3api create-bucket --bucket session-lens 2>/dev/null || true
        aws --endpoint-url http://s3:8333 s3api put-bucket-lifecycle-configuration --bucket session-lens           --lifecycle-configuration '{"Rules":[{"ID":"expire-recordings","Status":"Enabled","Filter":{"Prefix":"recordings/"},"Expiration":{"Days":30}}]}'

  # --- deploy: app services built from the Dockerfile (`docker compose up --build`) ---

  migrate:
    build: .
    command: ["session-lens", "migrate"]
    environment: &app-env
      DATABASE_URL: mysql+asyncmy://session_lens:session_lens@mysql:3306/session_lens?charset=utf8mb4
      API_TOKEN: ${API_TOKEN:-dev-token}
      ENRICHER: ${ENRICHER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT_URL: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: session-lens
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RAW_RETENTION_DAYS: "30"
    depends_on:
      mysql: {condition: service_healthy}
      s3: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    restart: "no"

  api:
    build: .
    command: ["session-lens", "api"]
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["session-lens", "worker"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}

configs:
  s3-config:
    content: |
      {"identities":[{"name":"session-lens","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  mysql-data:
  s3-data:
