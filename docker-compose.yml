# Local-only stack: recordings never leave this machine.
#   make up                    # token, then mysql, migrate, api (127.0.0.1:8000) and worker
#   docker compose up -d mysql # just the database, for tests and `make api` / `make worker`
# Raw recordings are stored on the filesystem in the shared `data` volume (DATA_DIR=/data).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: session_lens
      MYSQL_USER: session_lens
      MYSQL_PASSWORD: session_lens
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional S3-compatible store for raw recordings, off by default: `docker compose --profile s3
  # up -d s3 s3-init`. Then point the app at it with S3_ENDPOINT_URL=http://s3:8333 and the S3_*
  # settings. NOTE: SeaweedFS accepts and returns the 30-day lifecycle rule (so
  # `session-lens check-bucket` passes) but does NOT enforce it. It needs path-style addressing
  # (S3_ADDRESSING_STYLE=path if "auto" fails).
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"
    volumes:
      - s3-data:/data
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the bucket, applies the 30-day expiry rule on recordings/ and reads it back,
  # failing loudly if the server does not report it. Safe to re-run.
  s3-init:
    profiles: ["s3"]
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        s3api="aws --endpoint-url http://s3:8333 s3api"
        for i in $$(seq 30); do $$s3api list-buckets >/dev/null 2>&1 && break; sleep 1; done  # S3 port may lag the healthcheck
        $$s3api create-bucket --bucket session-lens 2>/dev/null || true
        $$s3api put-bucket-lifecycle-configuration --bucket session-lens           --lifecycle-configuration '{"Rules":[{"ID":"expire-recordings","Status":"Enabled","Filter":{"Prefix":"recordings/"},"Expiration":{"Days":30}}]}'
        days=$$($$s3api get-bucket-lifecycle-configuration --bucket session-lens           --query 'Rules[?Status==`Enabled`&&Filter.Prefix==`recordings/`].Expiration.Days | [0]' --output text)
        if [ "$$days" != "30" ]; then
          echo "lifecycle rule not applied (got: $$days)" >&2
          exit 1
        fi
        echo "lifecycle rule applied: recordings/ expire after $$days days (not enforced by SeaweedFS)"

  # --- app services, built from the Dockerfile ---

  migrate:
    build: .
    command: ["session-lens", "migrate"]
    environment: &app-env
      DATABASE_URL: mysql+asyncmy://session_lens:session_lens@mysql:3306/session_lens?charset=utf8mb4
      # Random, generated into the git-ignored .env by `make token`.
      API_TOKEN: ${API_TOKEN:?run `make token` first}
      ENRICHER: ${ENRICHER:-mock}
      STORAGE: filesystem
      DATA_DIR: /data
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
      # In-process retention sweep interval (the worker runs it); the app's default applies if unset.
      # CLEANUP_INTERVAL_SECONDS: 3600
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    # Inside the container the API must bind 0.0.0.0 to be reachable through the published port;
    # the host side is still loopback-only (127.0.0.1:8000 below).
    command: ["session-lens", "api", "--host", "0.0.0.0"]
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/data
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["session-lens", "worker"]
    environment:
      <<: *app-env
      # Default is the mock enricher. To use a local Ollama on the host, set ENRICHER=ollama (in
      # .env) and uncomment OLLAMA_URL and extra_hosts. The app validates that the URL is local.
      # OLLAMA_URL: http://host.docker.internal:11434
      # OLLAMA_MODEL: llama3.1:8b
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
    depends_on:
      migrate: {condition: service_completed_successfully}

configs:
  s3-config:
    content: |
      {"identities":[{"name":"session-lens","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  mysql-data:
  data:
    name: session-lens-data
  s3-data:
