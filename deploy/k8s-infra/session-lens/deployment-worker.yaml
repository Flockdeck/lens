apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-lens-worker
  namespace: session-lens
  labels:
    app: session-lens
    component: worker
spec:
  # Workers claim with SELECT ... FOR UPDATE SKIP LOCKED, so more replicas are safe.
  replicas: 1
  selector:
    matchLabels:
      app: session-lens
      component: worker
  template:
    metadata:
      labels:
        app: session-lens
        component: worker
    spec:
      serviceAccountName: session-lens
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "ghcr.io/jmwri/session-lens:0.0.1" # {"$imagepolicy": "flux-system:session-lens"}
          imagePullPolicy: IfNotPresent
          command: ["session-lens", "worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: databaseUrl}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: apiToken}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: anthropicApiKey}
            - name: ENRICHER
              value: anthropic
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      # Claims left behind on shutdown are re-queued after claim_timeout_seconds.
      terminationGracePeriodSeconds: 60
