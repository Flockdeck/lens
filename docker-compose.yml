services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: session_lens
      MYSQL_USER: session_lens
      MYSQL_PASSWORD: session_lens
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # OPTIONAL S3-compatible store (profile "s3"): only used with STORAGE=s3. By default
  # recordings are files under DATA_DIR on the local filesystem and nothing leaves the machine.
  # Start it with `docker compose --profile s3 up -d --wait s3 && docker compose --profile s3 run
  # --rm s3-init`, then run the S3 tests with S3_ENDPOINT_URL=http://127.0.0.1:9000. SeaweedFS
  # accepts the lifecycle rule but does not enforce it; the app deletes expired files itself.
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:8333"  # matches the S3_ENDPOINT_URL default
    volumes:
      - s3-data:/data
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the bucket, applies a 30-day expiry rule on recordings/ and reads it back,
  # failing loudly if the server does not report it (it sweeps orphans from failed uploads; the
  # app deletes expired files itself). Safe to re-run.
  s3-init:
    profiles: ["s3"]
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        s3api="aws --endpoint-url http://s3:8333 s3api"
        for i in $$(seq 30); do $$s3api list-buckets >/dev/null 2>&1 && break; sleep 1; done  # S3 port may lag the healthcheck
        $$s3api create-bucket --bucket session-lens 2>/dev/null || true
        $$s3api put-bucket-lifecycle-configuration --bucket session-lens           --lifecycle-configuration '{"Rules":[{"ID":"expire-recordings","Status":"Enabled","Filter":{"Prefix":"recordings/"},"Expiration":{"Days":30}}]}'
        days=$$($$s3api get-bucket-lifecycle-configuration --bucket session-lens           --query 'Rules[?Status==`Enabled`&&Filter.Prefix==`recordings/`].Expiration.Days | [0]' --output text)
        if [ "$$days" != "30" ]; then
          echo "lifecycle rule not applied (got: $$days)" >&2
          exit 1
        fi
        echo "lifecycle rule applied: recordings/ expire after $$days days (not enforced by SeaweedFS)"

  # --- deploy: app services built from the Dockerfile (`docker compose up --build`) ---

  migrate:
    build: .
    command: ["session-lens", "migrate"]
    environment: &app-env
      DATABASE_URL: mysql+asyncmy://session_lens:session_lens@mysql:3306/session_lens?charset=utf8mb4
      API_TOKEN: ${API_TOKEN:-dev-token}
      # Local only: the app refuses a default API_TOKEN without this. Never set it in k8s.
      ALLOW_INSECURE_DEV: "1"
      ENRICHER: ${ENRICHER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Raw recordings: files in a volume shared by api and worker; nothing leaves the machine.
      STORAGE: filesystem
      DATA_DIR: /data
      RAW_RETENTION_DAYS: "30"
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    command: ["session-lens", "api", "--host", "0.0.0.0"]
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]  # this machine only
    volumes:
      - app-data:/data
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["session-lens", "worker"]
    environment: *app-env
    volumes:
      - app-data:/data
    depends_on:
      migrate: {condition: service_completed_successfully}

configs:
  s3-config:
    content: |
      {"identities":[{"name":"session-lens","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  mysql-data:
  app-data:
  s3-data:
