---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: session-lens
  namespace: flux-system
spec:
  image: ghcr.io/jmwri/session-lens
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: session-lens
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: session-lens
  digestReflectionPolicy: Always
  interval: 10m
  policy:
    semver:
      range: '>=0.0.1'
