apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session-lens
  namespace: session-lens
  annotations:
    haproxy.org/check: "true"
    haproxy.org/check-http: "GET /healthz"
    haproxy.org/forwarded-for: "true"
    haproxy.org/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Batch uploads are multipart bodies of up to ~256 MiB (the API's
    # MAX_REQUEST_BYTES). HAProxy has no body-size cap of its own, so the API
    # enforces the limit; give slow uploads time to finish instead.
    haproxy.org/client-timeout: "10m"
    haproxy.org/server-timeout: "10m"
spec:
  ingressClassName: haproxy
  rules:
    - host: session-lens.jmwri.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session-lens
                port:
                  number: 80
  tls:
    - secretName: session-lens-tls
      hosts:
        - session-lens.jmwri.dev
