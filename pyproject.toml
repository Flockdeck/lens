[project]
name = "lens"
version = "0.1.0"
description = "Ingests Flockdeck pane recordings, computes metrics, enriches them with an LLM, and serves an API and web UI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=1.0",
    "prometheus-client>=0.20",
    # asyncmy needs it for MySQL 8 caching_sha2_password
    "aiosqlite>=0.22.1",
    "platformdirs>=4.12.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "playwright>=1.45",
    "mypy>=1.10",
    "pyinstaller>=6.22.3",
    "jsonschema>=4.26.0",
    "pytest-cov>=7.1.0",
    "cryptography>=50.0.2",
    "moto[server]>=5.2.3",
]

[project.scripts]
lens = "lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: drives a real browser; skipped when none can be launched"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "*.md"]  # contract snippets are prose, not code to reformat
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
