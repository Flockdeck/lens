<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>session-lens</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="img/flockdeck-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/flockdeck-color.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/submit"><img class="brand-mark" src="img/flockdeck-mark.svg" alt="" width="28" height="28"><span>session-lens</span></a>
    <nav id="nav" aria-label="Main">
      <a href="#/submit">Submit</a>
      <a href="#/sessions">Sessions</a>
      <a href="#/insights">Insights</a>
    </nav>
    <div class="topbar-end">
      <button id="theme" type="button" class="btn btn-quiet">Theme</button>
      <button id="signout" type="button" class="btn btn-quiet">Change token</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer id="statusbar" class="statusbar" data-state="unknown">
    <details>
      <summary><span id="status-text">Status unavailable</span></summary>
      <p>Nothing is uploaded. Recordings stay on this machine and are read only by this server.</p>
      <p>How long raw recordings are kept is set on the server by RAW_RETENTION_DAYS (0 keeps them until you delete them).</p>
    </details>
  </footer>
  <noscript><p class="noscript">session-lens needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
