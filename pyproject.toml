[project]
name = "session-lens"
version = "0.1.0"
description = "Ingests Flockdeck pane recordings, computes metrics, enriches them with an LLM, and serves an API and web UI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=1.0",
    "prometheus-client>=0.20",
    "cryptography>=50.0.2",  # asyncmy needs it for MySQL 8 caching_sha2_password
]

[project.optional-dependencies]
s3 = ["aioboto3>=13"]  # only for STORAGE=s3

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "playwright>=1.45",
    "mypy>=1.10",
]

[project.scripts]
session-lens = "session_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: drives a real browser; skipped when none can be launched"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "*.md"]  # contract snippets are prose, not code to reformat
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# The S3 store is an optional extra (`uv sync --extra s3`); type-check the same way with or without it.
[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*", "aiobotocore.*", "botocore", "botocore.*"]
ignore_missing_imports = true
