apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-lens-worker
  namespace: session-lens
  labels:
    app: session-lens
    component: worker
spec:
  # Workers claim with SELECT ... FOR UPDATE SKIP LOCKED, so more replicas are safe.
  replicas: 1
  selector:
    matchLabels:
      app: session-lens
      component: worker
  template:
    metadata:
      labels:
        app: session-lens
        component: worker
    spec:
      serviceAccountName: session-lens
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The api's init container owns migrations. Block until the schema is at head so a
        # worker never runs against the old schema during a rollout. Needs
        # `session-lens migrate --check` (exit non-zero until head); retried until it passes.
        - name: wait-for-schema
          image: "ghcr.io/jmwri/session-lens:0.0.1" # {"$imagepolicy": "flux-system:session-lens"}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until session-lens migrate --check; do echo "waiting for schema"; sleep 5; done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: databaseUrl}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: "ghcr.io/jmwri/session-lens:0.0.1" # {"$imagepolicy": "flux-system:session-lens"}
          imagePullPolicy: IfNotPresent
          command: ["session-lens", "worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: databaseUrl}
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3EndpointUrl}
            - name: S3_REGION
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3Region}
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3Bucket}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3AccessKey}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: s3SecretKey}
            - name: RAW_RETENTION_DAYS
              value: "30"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: session-lens-secret, key: anthropicApiKey}
            - name: ENRICHER
              value: anthropic
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      # Claims left behind on shutdown are re-queued after claim_timeout_seconds.
      terminationGracePeriodSeconds: 60
