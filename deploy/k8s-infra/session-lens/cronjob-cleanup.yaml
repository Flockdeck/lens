# Database-only reconciliation: marks rows whose raw recording is older than
# RAW_RETENTION_DAYS as expired and prunes old finished batches. It never touches
# the bucket (a lifecycle rule expires the objects), so it gets no S3 credentials.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: session-lens-cleanup
  namespace: session-lens
  labels:
    app: session-lens
    component: cleanup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: session-lens
            component: cleanup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: session-lens
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: "ghcr.io/jmwri/session-lens:0.0.1" # {"$imagepolicy": "flux-system:session-lens"}
              imagePullPolicy: IfNotPresent
              command: ["session-lens", "cleanup"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: session-lens-secret, key: databaseUrl}
                - name: RAW_RETENTION_DAYS
                  value: "30"
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
