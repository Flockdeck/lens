# `docker compose up -d --wait mysql minio` then `docker compose run --rm minio-init` is enough
# for development and tests.
# `docker compose up --build` also runs the api and worker from the Dockerfile.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: session_lens
      MYSQL_USER: session_lens
      MYSQL_PASSWORD: session_lens
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    # No healthcheck: the image's tooling is not guaranteed (no curl, and `mc` has no alias
    # inside it), so minio-init waits for the server itself.

  # Creates the bucket and the same lifecycle rule terrawost sets on Spaces
  # (expire recordings/ after RAW_RETENTION_DAYS).
  minio-init:
    image: minio/mc
    depends_on:
      minio: {condition: service_started}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
        mc mb --ignore-existing local/session-lens &&
        mc ilm rule add --prefix recordings/ --expire-days $${RAW_RETENTION_DAYS:-30} local/session-lens
    restart: "no"

  migrate:
    build: .
    command: ["session-lens", "migrate"]
    environment: &app-env
      DATABASE_URL: mysql+asyncmy://session_lens:session_lens@mysql:3306/session_lens?charset=utf8mb4
      API_TOKEN: ${API_TOKEN:-dev-token}
      ENRICHER: ${ENRICHER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: session-lens
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
    depends_on:
      mysql: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: "no"

  api:
    build: .
    command: ["session-lens", "api"]
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["session-lens", "worker"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  mysql-data:
  minio-data:
